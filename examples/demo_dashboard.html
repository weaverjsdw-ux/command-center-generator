/* ---------- helpers ---------- */
function el(tag, cls, text){ var n=document.createElement(tag); if(cls){n.className=cls;} if(text!=null){n.textContent=text;} return n; }
function chip(text, cls){ return el("span","chip"+(cls?" "+cls:""), text); }
function qtag(){ return el("span","chip quoted-tag","[quoted]"); }
function byCode(c){ for(var i=0;i<MAP.assets.length;i++){ if(MAP.assets[i].code===c){ return MAP.assets[i]; } } return null; }

/* closed label→coordinate whitelist (leading-token match; unlisted → unmapped, never coerced) */
var WL = [
  { re:/^(moderate-high|medium-high)\b/, v:0.675 },
  { re:/^(low-medium|medium-low)\b/, v:0.35 },
  { re:/^(highest|high)\b/, v:0.85 },
  { re:/^(medium|moderate)\b/, v:0.5 },
  { re:/^low\b/, v:0.2 },
  { re:/^(none|n\/a)\b/, v:"na" }
];
function mapLabel(raw){
  if(raw==null||raw===""){ return {kind:"missing"}; }
  var s=String(raw).toLowerCase().trim();
  for(var i=0;i<WL.length;i++){ if(WL[i].re.test(s)){ return WL[i].v==="na"?{kind:"na",literal:raw}:{kind:"coord",v:WL[i].v,literal:raw}; } }
  return {kind:"unmapped",literal:raw};
}

function sortAssets(key){
  var arr=MAP.assets.slice();
  function tier(v){ var m=mapLabel(v); if(m.kind==="coord"){return -m.v;} if(m.kind==="na"){return 1;} return 2; }
  arr.sort(function(a,b){

}

  row("missing (prep to unlock)",missTxt.join(" · "),a.code==="PUB-3");
  row("honest call","“"+a.honest+"”",a.honest_q);
  row("posture",a.posture+" — "+a.posture_src,false);
  row("status",a.status+(a.shelved?" · SHELVED public lane":""),false);
  host.appendChild(dl);
  var f=el("div","files chips");
  for(var j=0;j<a.files.length;j++){ f.appendChild(chip(a.files[j])); }
  if(a.files_q){ f.appendChild(qtag()); }
  host.appendChild(el("dt","faint","real files cited"));
  host.appendChild(f);
}

(function analysis(){
  var s=document.getElementById("tab-analysis");
  s.appendChild(el("h2",null,"Analysis"));
  var grid=el("div"); grid.id="analysis-grid";
  var left=el("div");

  var sp=el("div","panel");
  sp.appendChild(el("h3",null,"Spine — all assets (ordering authority: the ranked table)"));
  var sb=el("div","sortbtns");
  var keys=[["rank","rank (default)"],["readiness",MAP.axes.x.toLowerCase()],["pull",MAP.axes.y.toLowerCase()],["magnitude","magnitude (not quantified → rank order)"]];
  for(var i=0;i<keys.length;i++){
    (function(k,label){
      var b=el("button",k==="rank"?"active":"",label);
      b.addEventListener("click",function(){
        spineSort=k;
        var bs=sb.querySelectorAll("button"); for(var x=0;x<bs.length;x++){ bs[x].classList.remove("active"); }
        b.classList.add("active"); renderSpine();
      });
      sb.appendChild(b);
    })(keys[i][0],keys[i][1]);
  }
  sp.appendChild(sb);
  var spine=el("div"); spine.id="spine"; sp.appendChild(spine);
  left.appendChild(sp);

  var mx=el("div","panel");
  mx.appendChild(el("h3",null,"Matrix — "+MAP.axes.x+" × "+MAP.axes.y));
  renderMatrix(mx);
  left.appendChild(mx);

  var ld=el("div","panel");
  renderLadder(ld);
  left.appendChild(ld);

  grid.appendChild(left);
  var det=el("div"); det.id="detail"; grid.appendChild(det);
  s.appendChild(grid);
  renderSpine(); renderDetail();
})();

/* ---------- Tab 4: EXECUTION ---------- */
(function execution(){
  var s=document.getElementById("tab-execution");
  s.appendChild(el("h2",null,"Execution"));

  var st=el("div"); st.id="standing"; st.textContent=MAP.standing_rule; s.appendChild(st);

  var qp=el("div","panel");
  qp.appendChild(el("h3",null,"Decision queue"));
  var tbl=el("table");
  var hr=el("tr");
  var heads=["Option","Status","Next action","Owner","Gate","Do-not-do-yet"];
  for(var h=0;h<heads.length;h++){ hr.appendChild(el("th",null,heads[h])); }
  tbl.appendChild(hr);
  var arr=MAP.assets.slice().sort(function(a,b){return a.rank-b.rank;});
  for(var i=0;i<arr.length;i++){
    var a=arr[i];
    var tr=el("tr");
    var c1=el("td");
    c1.appendChild(el("span","code mono",a.code));
    c1.appendChild(document.createTextNode(" "+a.name));
    tr.appendChild(c1);
    var c2=el("td"); c2.appendChild(chip(a.status,a.statusc)); tr.appendChild(c2);
    var c3=el("td",null,a.next); if(a.code==="PUB-3"){ c3.appendChild(document.createTextNode("; ")); var qq=el("span",null,"a publishable code sample"); c3.appendChild(qq); c3.appendChild(qtag()); } tr.appendChild(c3);
    tr.appendChild(el("td",null,"operator (self) — single-operator catalog"));
    tr.appendChild(el("td",null,a.gate));
    tr.appendChild(el("td",null,a.dndcell));
    tbl.appendChild(tr);
  }
  qp.appendChild(tbl);
  qp.appendChild(el("div","faint srcnote","status routing: H2 → PUB-1 AUTHORIZED-prep · H3 → PUB-3 QUEUED · assets named by no decision → catalog-only, gate UNKNOWN · H4 is a standing rule and renders above as a gate"));
  s.appendChild(qp);

  /* dependency / unlock DAG — computed in one pass from MAP.assets[].missing */
  var dg=el("div","panel");
  dg.appendChild(el("h3",null,"Dependency / unlock DAG — prep → asset"));
  var nodes={}, order=[];
  for(var x=0;x<MAP.assets.length;x++){
    var A=MAP.assets[x];
    for(var y=0;y<A.missing.length;y++){
      var key=A.missing[y].x.toLowerCase().replace(/\s+/g," ").trim();
      if(!nodes[key]){ nodes[key]={label:A.missing[y].x,targets:[],q:A.missing[y].q}; order.push(key); }
      if(nodes[key].targets.indexOf(A.code)<0){ nodes[key].targets.push(A.code); }
    }
  }
  var linkCount=0, maxFan=0, withPrep={}, hubKey=null;
  for(var o=0;o<order.length;o++){
    var nd=nodes[order[o]];
    linkCount+=nd.targets.length;
    for(var t=0;t<nd.targets.length;t++){ withPrep[nd.targets[t]]=true; }
    if(nd.targets.length>maxFan){ maxFan=nd.targets.length; hubKey=order[o]; }
  }
  var M=0; for(var w in withPrep){ if(Object.prototype.hasOwnProperty.call(withPrep,w)){ M++; } }

  if(linkCount===0){
    dg.appendChild(el("div","dim","no unlock dependencies stated in map"));
  } else {
    var rowH=30, pad=20, PH=order.length*rowH+pad*2, PW=920, leftW=430, rightX=700;
    var svg=sv("svg",{viewBox:"0 0 "+PW+" "+PH,width:"100%"});
    var assetY={}, ac=MAP.assets.slice().sort(function(a,b){return a.rank-b.rank;});
    for(var az=0;az<ac.length;az++){
      var yy=pad+(az+0.5)*((PH-2*pad)/ac.length);
      assetY[ac[az].code]=yy;
      var bx=sv("rect",{x:rightX,y:yy-11,width:150,height:22,rx:4,"class":"nodebox"});
      bx.setAttribute("data-code",ac[az].code);
      svg.appendChild(bx);
      var tx=sv("text",{x:rightX+8,y:yy+4,"class":"nodetxt"}); tx.textContent=ac[az].code+" (rank "+ac[az].rank+")"; svg.appendChild(tx);
    }
    for(var p=0;p<order.length;p++){
      var nd2=nodes[order[p]];
      var py=pad+(p+0.5)*rowH;
      var lb=nd2.label.length>52?nd2.label.slice(0,50)+"…":nd2.label;
      var t2=sv("text",{x:8,y:py+4,"class":"nodetxt"}); t2.textContent="P"+(p+1)+" · "+lb+(nd2.q?" [quoted]":"");
      var ti2=sv("title",{}); ti2.textContent=nd2.label; t2.appendChild(ti2);
      svg.appendChild(t2);
      for(var t3=0;t3<nd2.targets.length;t3++){
        var ay=assetY[nd2.targets[t3]];
        svg.appendChild(sv("path",{d:"M "+leftW+" "+py+" C "+(leftW+120)+" "+py+", "+(rightX-120)+" "+ay+", "+rightX+" "+ay,"class":"dagline"}));
      }
    }
    dg.appendChild(svg);
    var noPrep=[]; for(var np=0;np<MAP.assets.length;np++){ if(!withPrep[MAP.assets[np].code]){ noPrep.push(MAP.assets[np].code); } }
    dg.appendChild(el("div","caption","assets with no stated prep: "+(noPrep.length?noPrep.join(", "):"none")+" · distinct prep nodes: "+order.length+" · assets with ≥1 incoming prep link (M): "+M));
    if(maxFan<2){
      dg.appendChild(el("div","dim","no dominant hub — maximum fan-out is 1 (each prep item unlocks a single asset); the map states no shared-prep synonym set, so prep items are not merged"));
    } else {
      dg.appendChild(el("div","dim","“"+nodes[hubKey].label+"” unlocks "+nodes[hubKey].targets.length+" of "+M+" paths"));
    }
  }
  s.appendChild(dg);
})();

/* root render ran above, strictly after its dependencies, in document order. */
})();
</script>
