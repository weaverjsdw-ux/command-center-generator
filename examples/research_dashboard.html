function mapLabel(v){
  if(v===null||v===undefined||v==="") return {kind:"unknown"};
  const s = String(v).trim().toLowerCase();
  if(/^(none|n\/a)\b/.test(s)) return {kind:"na", literal:String(v)};
  for(let i=0;i<COORD_WHITELIST.length;i++){
    if(COORD_WHITELIST[i][0].test(s)) return {kind:"point", x:COORD_WHITELIST[i][1], literal:String(v)};
  }
  return {kind:"unmapped", literal:String(v)};
}
function forbiddenHit(a){

    if(MAP.honesty.forbiddenScan[i].test(rec)) return true;
  }
  return false;
}

  if(kids) kids.forEach(function(c){ if(c) n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}

  root.appendChild(grid);
  root.appendChild(el("div",{cls:"panel",id:"detail"}));
  renderSpine(); renderMatrix(); renderLadder(); renderDetail();
}
/* ============ Tab 4 — EXECUTION ============ */
function prepRefs(item){
  const m=item.match(/^everything upstream \((.+)\)$/i);
  if(m) return m[1].split(",").map(function(s){return s.trim();});
  return [item];
}
function normalizePrep(s){
  const t=s.toLowerCase().replace(/\s+/g," ").trim();
  /* stated-synonym set for THIS map: “prereg” is the map's own abbreviation of “pre-registration” */
  if(/(pre-?registration|prereg)/.test(t) && /\b(file|filed|filing)\b/.test(t)) return "file the pre-registration";
  return t;
}
function buildDag(){
  const nodes=[],index={};
  const edges=[];
  MAP.assets.forEach(function(a){
    a.missing.forEach(function(item){
      prepRefs(item).forEach(function(ref){
        const key=normalizePrep(ref);
        if(!(key in index)){
          index[key]=nodes.length;
          nodes.push({id:"P"+(nodes.length+1),key:key,label:ref,targets:[]});
        }
        const n=nodes[index[key]];
        if(n.targets.indexOf(a.code)<0){ n.targets.push(a.code); edges.push({p:n,a:a.code}); }
      });
    });
  });
  let maxFan=0;
  nodes.forEach(function(n){ if(n.targets.length>maxFan) maxFan=n.targets.length; });
  let hub=null;
  if(edges.length>0 && maxFan>1){
    const cands=nodes.filter(function(n){return n.targets.length===maxFan;});
    cands.sort(function(x,y){ return x.id<y.id?-1:1; }); /* tiebreak: lexicographically smallest id */
    if(cands.length===1||cands[0].id!==undefined) hub=cands[0];
    if(cands.length>1 && cands[0].targets.length===cands[1].targets.length){
      /* distinct-assets tiebreak equals fan-out here; fall back to smallest id (already sorted) */
      hub=cands[0];
    }
  }
  const withEdges={};
  edges.forEach(function(e){ withEdges[e.a]=true; });
  const M=Object.keys(withEdges).length;
  const noDeps=MAP.assets.filter(function(a){return !withEdges[a.code];});
  return {nodes:nodes,edges:edges,hub:hub,maxFan:maxFan,M:M,noDeps:noDeps};
}
function renderExecution(){
  const root=document.getElementById("tab-execution");
  const r4=MAP.decisions.filter(function(d){return d.kind==="standing-rule";})[0];
  if(r4){
    const gb=el("div",{cls:"gatebar"});
    gb.appendChild(el("div",{cls:"glead",text:r4.id+" (standing rule) — gate on "+r4.appliesTo}));
    gb.appendChild(el("div",{text:"[quoted] “"+r4.text+"”"}));
    root.appendChild(gb);
  }
  const qp=el("div",{cls:"panel"},[el("h2",{text:"Decision queue"})]);
  const tbl=el("table",{});
  tbl.appendChild(el("thead",{},[el("tr",{},[
    el("th",{text:"Option"}),el("th",{text:"Status"}),el("th",{text:"Next action"}),
    el("th",{text:"Owner"}),el("th",{text:"Gate"}),el("th",{text:"Do-not-do-yet"})
  ])]));
  const tb=el("tbody",{});
  MAP.assets.slice().sort(function(a,b){return a.rank-b.rank;}).forEach(function(a){
    tb.appendChild(el("tr",{},[
      el("td",{cls:"mono",text:a.code+" — "+a.name}),
      el("td",{cls:"mono",text:a.status+(a.statusSource&&a.statusSource.indexOf("R")===0?" ("+a.statusSource+")":"")}),
      el("td",{text:a.missing.join(" · ")+(a.parkedComputed?" (prep listing only — advancement parked)":"")}),
      el("td",{text:"operator (single-operator catalog)"}),
      a.gate?el("td",{text:a.gate}):el("td",{},[el("span",{cls:"unknown",text:"UNKNOWN"})]),
      a.dontYet?el("td",{text:a.dontYet}):el("td",{},[el("span",{cls:"unknown",text:"UNKNOWN"})])
    ]));
  });
  tbl.appendChild(tb);
  qp.appendChild(tbl);
  qp.appendChild(el("p",{cls:"note",text:"Status routing: R2 → AUTHORIZED-prep (TOOL-2) · R3 → QUEUED (MEM-1) · computed PARKED set → PARKED (TOOL-3) · named by no decision → catalog-only. Owner defaults to the operator: the map speaks as “me”/“future-me” and names no other owner."}));
  root.appendChild(qp);
  /* dependency / unlock DAG — computed, never asserted */
  const dag=buildDag();
  const dp=el("div",{cls:"panel"},[el("h2",{text:"Dependency / unlock DAG (prep → asset)"})]);
  if(dag.edges.length===0){
    dp.appendChild(el("p",{cls:"note",text:"no unlock dependencies stated in map"}));
  }else{
    const rowH=30, W=680, H=dag.nodes.length*rowH+30;
    const svg=svgEl("svg",{viewBox:"0 0 "+W+" "+H,width:"100%"});
    const ax={}, aOrder=MAP.assets.slice().sort(function(a,b){return a.rank-b.rank;});
    aOrder.forEach(function(a,i){ ax[a.code]=20+i*((H-40)/Math.max(aOrder.length-1,1)); });
    const py={};
    dag.nodes.forEach(function(n,i){ py[n.id]=14+i*rowH; });
    dag.edges.forEach(function(e){
      const y1=py[e.p.id]+9, y2=ax[e.a]+9;
      const isHub=dag.hub&&e.p.id===dag.hub.id;
      svg.appendChild(svgEl("path",{cls:"edge"+(isHub?" hub":""),d:"M 268 "+y1+" C 340 "+y1+", 380 "+y2+", 452 "+y2}));
    });
    dag.nodes.forEach(function(n){
      const y=py[n.id];
      const isHub=dag.hub&&n.id===dag.hub.id;
      svg.appendChild(svgEl("rect",{cls:"pnode"+(isHub?" hub":""),x:8,y:y,width:260,height:19,rx:3}));
      const t=svgEl("text",{cls:"ntext",x:14,y:y+13});
      t.textContent=n.id+" · "+(n.label.length>34?n.label.slice(0,33)+"…":n.label);
      const tip=svgEl("title",{}); tip.textContent=n.label+" → "+n.targets.join(", "); t.appendChild(tip);
      svg.appendChild(t);
    });
    aOrder.forEach(function(a){
      const y=ax[a.code];
      svg.appendChild(svgEl("rect",{cls:"anode",x:452,y:y,width:220,height:19,rx:3}));
      const t=svgEl("text",{cls:"ntext",x:458,y:y+13});
      t.textContent=a.code+" · "+(a.name.length>24?a.name.slice(0,23)+"…":a.name);
      svg.appendChild(t);
    });
    dp.appendChild(svg);
    if(dag.hub){
      dp.appendChild(el("p",{cls:"mono",text:"“"+dag.hub.label+"” unlocks "+dag.hub.targets.length+" of "+dag.M+" paths"}));
      dp.appendChild(el("p",{cls:"note",text:"Computed from the missing-lists edge set in one pass. Prep normalized by intent before edge derivation: “a filed prereg” (TOOL-3, named inside its “everything upstream (…)” item) and “file the pre-registration” (MEM-1) collapse to one node — “prereg” is the map's own abbreviation of “pre-registration”. The map states no shared benefit-qualifier for this hub, so none is rendered."}));
    }else{
      dp.appendChild(el("p",{cls:"mono",text:"no dominant hub"}));
    }
    if(dag.noDeps.length){
      dp.appendChild(el("p",{cls:"note",text:"no unlock dependency: "+dag.noDeps.map(function(a){return a.code;}).join(", ")}));
    }
  }
  root.appendChild(dp);
}

  SELECTED=code;

    c.classList.toggle("selected",c.id==="card-"+code);
  });
  renderSpine(); renderMatrix(); renderLadder(); renderDetail();
}
renderTopbar();

selectAsset("MEM-3"); /* rank 1 default selection */
document.getElementById("foot").textContent="Faithful encoding of the SOURCE MAP — absent values render UNKNOWN; conflicting values would render CONFLICT(a | b); nothing is invented. Visibility: "+MAP.meta.visibility+" · date "+MAP.meta.date+" ("+MAP.meta.dateSource+").";
})();
